<script>

const MEDIA={study:"study.mp4",stretch:"stretch.mp4",coffee:"coffee.mp4",phone:"phone.mp4",sleep:"sleep.mp4"};
const POSTERS={study:"poster_study.jpg",stretch:"poster_stretch.jpg",coffee:"poster_coffee.jpg",phone:"poster_phone.jpg",sleep:"poster_sleep.jpg"};
const SCHEDULE = [
  { s:0,    e:390,  label:"취침 중",          state:"sleep",  d:["새근새근...","내일을 위한 충전","Zzz..."] },
  { s:390,  e:420,  label:"기상 · 영단어",     state:"stretch",d:["눈 비비며 단어장 펴는 중","찬물 세수하고 정신 차리는 중"] },

  { s:480,  e:600,  label:"국어 비문학",       state:"study",  d:["과학 지문 구조도 그리는 중","시간 재며 지문 푸는 중","문장 3번째 다시 읽는 중"] },
  { s:600,  e:720,  label:"수학 · 미적분",     state:"study",  d:["27번 킬러 3회독 중","극한 정의로 다시 증명 중","계산 실수 잡아내는 중"] },
  { s:720,  e:780,  label:"점심 · 산책",       state:"stretch",d:["유일하게 폰 보는 시간","머리 식히며 폰 보는 중","스트레칭하는 중"] },
  { s:780,  e:930,  label:"수학 · 기하/문풀",  state:"study",  d:["기벡 공간도형 그리는 중","모의고사 한 회분 도는 중","오답 원인 분석 중"] },
  { s:930,  e:1080, label:"사탐 · 생활과윤리", state:"study",  d:["기출 선지 꼼꼼히 분석 중","사상가 입장 표로 정리 중","제시문 두 번 읽는 중"] },
  { s:1080, e:1140, label:"저녁 식사",         state:"eat",    d:["밥 먹으며 인강 듣는 중","10분 눈 감고 쉬는 중"] },
  { s:1140, e:1260, label:"과탐 · 생명Ⅰ",      state:"study",  d:["유전 가계도 분석 중","근수축 과정 암기 중","오답 개념 다시 잡는 중"] },
  { s:1260, e:1350, label:"국어 · 오답 정리",  state:"study",  d:["오답노트 색깔별 정리 중","문학 배경지식 보는 중","EBS 연계 확인 중"] },

  { s:1410, e:1440, label:"취침 중",           state:"sleep",  d:["방금 잠든 듯","Zzz..."] },
];
const isStudy=x=>x.state==="study";
const RAW=SCHEDULE.filter(isStudy).reduce((a,x)=>a+(x.e-x.s),0);
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return (h^=h>>>16)>>>0;}
const SUNUNG=new Date("2026-11-19T08:40:00+09:00");
const Y0=new Date(2026,1,1);            // 재수 본격 시작점
const WK=["일","월","화","수","목","금","토"];
const parseDate=k=>{const p=k.split("-");return new Date(+p[0],(+p[1])-1,+p[2]);};
const ld=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
/* 컨디션: 단일 해시가 아니라 며칠씩 이어지는 슬럼프/정점 파동 */
function dayTypeFor(k){
  const h=(hashStr(k)%1000)/1000;
  const di=Math.round((parseDate(k)-Y0)/86400000);
  const wave=0.5+0.27*Math.sin(di/4.3)+0.17*Math.sin(di/10.7+1.1);
  const r=Math.max(0,Math.min(1, wave*0.68+h*0.32));
  if(r<0.12)return{key:"번아웃",mult:0.34,color:"#b79fc0",r};
  if(r<0.33)return{key:"슬럼프",mult:0.50,color:"#cf9f6a",r};
  if(r<0.79)return{key:"평범",mult:0.66,color:"#e0a85c",r};

 var meLvSum=0,siOvSum=0,meGsum=0,siGsum=0,rows="",j;
 var meCum=0;for(var kk in log){meCum+=Number(log[kk]||0);}
 var siCum=0,d=new Date(Y0),now=new Date(),cnt=0;while(d<=now&&cnt<400){siCum+=fullDay(ld(d))*3600;d.setDate(d.getDate()+1);cnt++;}
 for(j=0;j<CURRIC.length;j++){var s=CURRIC[j],M=subjMastery(s),lv=myLevel(s.key);
  meLvSum+=lv;siOvSum+=M.ov;
  var meG=gradeFromMastery(s.key,lv),siSc=siScore(s),gap=M.ov-lv;meGsum+=meG;siGsum+=siSc.grade;
  var gtxt=gap>0?("시은 +"+gap):(gap<0?("내가 +"+(-gap)):"동률"),gcol=gap>0?"#cdab63":(gap<0?"#9cc7bf":"#857b88");
  rows+='<div class="cmprow"><div class="cmphd"><span class="nm">'+s.subj+'</span><span class="gp" style="color:'+gcol+'">'+gtxt+'</span></div>'
   +'<div class="cmpbar"><div class="cmpL"><div class="cmpme" style="width:'+lv+'%"></div></div><div class="cmpR"><div class="cmpsi" style="width:'+M.ov+'%"></div></div></div>'
   +'<div class="cmpfoot"><span class="me">나 '+lv+' · '+meG+'등급</span><span class="si">시은 '+M.ov+' · 예상 '+siSc.grade+'등급 · 진도 '+M.p.pct+'%</span></div></div>';}
 var liveU=window._liveU||0,siSec=window._siSec||0;
 var sum='<div class="cmpsum">'
  +'<div class="cmpcard"><div class="cmpcl">오늘 순공</div><div class="cmpcv"><span class="me" id="cmpMeToday">'+hm(liveU)+'</span><span class="si" id="cmpSiToday">'+hm(siSec)+'</span></div></div>'
  +'<div class="cmpcard"><div class="cmpcl">누적 순공</div><div class="cmpcv"><span class="me">'+hm(meCum)+'</span><span class="si">'+hm(Math.round(siCum))+'</span></div></div>'
  +'<div class="cmpcard"><div class="cmpcl">예상 등급합</div><div class="cmpcv"><span class="me">'+meGsum+'</span><span class="si">'+siGsum+'</span></div></div></div>';
 var edit='<div class="myedit"><span style="letter-spacing:.5px">내 현재 실력 입력 (0~100, 점수처럼)</span><br>';
 for(j=0;j<CURRIC.length;j++){var s2=CURRIC[j];edit+='<label>'+s2.subj+' <input class="myin" type="number" min="0" max="100" value="'+myLevel(s2.key)+'" onchange="setMyLevel(\''+s2.key+'\',this.value)"></label>';}
 edit+='</div>';
 var el=$("cmpwrap");if(el)el.innerHTML=sum+'<div class="sct"><div class="lbl">과목별 실력 격차 · 나(파랑) vs 시은(노랑)</div>'+rows+'</div>'+edit;
}
/* ===== 모의고사 일정 + 시은 예상 등급 투영 ===== */
var EXAMS=[{d:"2026-06-04",n:"6월 모의평가"},{d:"2026-09-03",n:"9월 모의평가"},{d:"2026-11-19",n:"수능"}];
function projAt(dstr){var de=parseDate(dstr),T=(de-Y0)/(SUNUNG-Y0),codes={math:"수",kor:"국",eng:"영",bio:"생",eth:"윤"},out=[],j;
 for(j=0;j<CURRIC.length;j++){out.push(codes[CURRIC[j].key]+projScore(CURRIC[j],T));}
 return out.join("  ");}
function buildExams(){var h="",n=new Date(),i;for(i=0;i<EXAMS.length;i++){var e=EXAMS[i],de=parseDate(e.d),dd=Math.ceil((de-n)/86400000),ddtxt=dd>0?("D-"+dd):(dd===0?"D-DAY":"종료");
 h+='<div class="examrow"><div class="examn">'+e.n+'<s>시은 예상 등급 · '+projAt(e.d)+'</s></div><div class="examd">'+ddtxt+'<br><span class="scchip">'+e.d.slice(5).replace("-",".")+'</span></div></div>';}
 var el=$("examwrap");if(el)el.innerHTML=h;}
function mediaKey(seg){
  if(seg.state==="sleep")return "sleep";
  if(seg.state==="eat")return "coffee";
  if(seg.state==="stretch")return seg.label.indexOf("산책")>=0?"phone":"stretch";
  return "study";
}
let log={}; try{log=JSON.parse(localStorage.getItem("studylog")||"{}")||{};}catch(e){log={};}
let syncKey=localStorage.getItem("synckey")||"";
let running=false, startTs=null, dk=ld(new Date()), saveCtr=0, lastDetail="", typeTimer=null, curKey=null, active="A";
const base=()=>log[dk]||0;
const save=()=>{try{localStorage.setItem("studylog",JSON.stringify(log));}catch(e){}};
function $(id){return document.getElementById(id);}
// ---- server sync (공부시간만 동기화) ----
async function loadServer(){ if(!syncKey)return;
  try{ const r=await fetch("/api/sync?key="+encodeURIComponent(syncKey)); const srv=await r.json();
    if(srv&&typeof srv==="object"){for(const k in srv){log[k]=Math.max(Number(log[k]||0),Number(srv[k]||0));} save(); tick();}
    $("synced").textContent="● 동기화: "+syncKey;
  }catch(e){ $("synced").textContent="○ 동기화 연결 실패"; }
}
async function saveServer(){ if(!syncKey)return;
  try{ await fetch("/api/sync?key="+encodeURIComponent(syncKey),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(log)}); }catch(e){}
}
function setupSync(){ const k=window.prompt("동기화 키를 입력하세요.\n모든 기기에서 같은 키를 넣으면 공부시간이 자동으로 동기화됩니다.\n(비우면 동기화 끔)", syncKey||"");
  if(k===null)return; syncKey=k.trim(); localStorage.setItem("synckey",syncKey);
  if(syncKey){ $("synced").textContent="● 동기화: "+syncKey; loadServer(); } else { $("synced").textContent="○ 동기화 꺼짐"; } }
function playCur(){ if(window.curVid){var p=window.curVid.play(); if(p&&p.catch)p.catch(function(){});} }
function setMedia(key){
  if(key===curKey)return; curKey=key;
  const showId=active==="A"?"vidB":"vidA", hideId=active==="A"?"vidA":"vidB";
  const show=$(showId), hide=$(hideId);
  show.poster=POSTERS[key]; show.src=MEDIA[key]; show.load(); window.curVid=show;
  const p=show.play(); if(p&&p.catch)p.catch(function(){});
  show.style.opacity="1"; hide.style.opacity="0";
  active=showId==="vidA"?"A":"B";
}
function tick(){
  const now=new Date(); const cur=ld(now);
  if(cur!==dk){dk=cur; window._pace=recentPace(cur); if(running)startTs=Date.now(); buildProgress(); buildMastery(); buildCompare();}
  const minNow=now.getHours()*60+now.getMinutes();
  const seg=segAt(minNow), dt=dayTypeFor(dk), st=seg.state;
  if(running&&startTs!=null){const el=(Date.now()-startTs)/1000; if(++saveCtr>=15){log[dk]=(log[dk]||0)+el; startTs=Date.now(); saveCtr=0; save(); saveServer();}}
  const siSec=Math.round(studiedMin(minNow)*60*dt.mult);
  const liveU=base()+(running&&startTs!=null?(Date.now()-startTs)/1000:0);
  window._liveU=liveU; window._siSec=siSec;
  $("clk").textContent=fmtC(minNow*60+now.getSeconds());
  $("dt").textContent=ld(now).replace(/-/g,". ")+" · "+WK[now.getDay()]+"요일";
  $("cond").textContent=dt.key; $("conddot").style.background=dt.color;
  if($("condst")){var stn=condStreak(dk); $("condst").textContent=" · "+stn+"일째";}
  $("dday").textContent="D-"+Math.ceil((SUNUNG-now)/86400000);
  setMedia(mediaKey(seg));
  const sleeping=st==="sleep";
  $("glow").style.opacity=sleeping?"0":"1";
  $("stt").innerHTML='<span class="pd" style="background:'+(sleeping?"#b79fc0":st==="study"?"#8fd6a8":"#e6b56a")+'"></span>'+(sleeping?"OFFLINE":st==="study"?"STUDYING":"BREAK");
  const detail=seg.d[Math.floor((minNow/7)%seg.d.length)];
  $("nowlabel").textContent="지금 — "+seg.label+" · ";
  if(detail!==lastDetail){lastDetail=detail; let i=0; $("nowtype").textContent=""; clearInterval(typeTimer);
    typeTimer=setInterval(function(){i++; $("nowtype").textContent=detail.slice(0,i); if(i>=detail.length)clearInterval(typeTimer);},34);}
  $("cur").style.display=st==="study"?"inline-block":"none";
  $("siHero").textContent=hm(siSec);
  $("mev").textContent=hm(liveU);
  $("melbl").textContent="나의 오늘 순공"+(liveU>siSec&&!sleeping?" · 리드 중":"");
  let streak=0; for(let i=0;i<60;i++){const dd=new Date(now); dd.setDate(dd.getDate()-i); const k=ld(dd); const v=i===0?liveU:(log[k]||0); if(v>=600)streak++; else break;}
  $("strk").textContent="연속 "+streak+"일 기록 · 목표 8시간";
  $("btn").textContent=running?"멈춤":"공부 시작"; $("btn").className="btn "+(running?"pause":"start");
  const total=Math.max(liveU+siSec,1), siPct=Math.round(siSec/total*100);
  $("siH2").textContent=hm(siSec); $("meH2").textContent=hm(Math.round(liveU)); $("tA").style.width=siPct+"%";
  const gap=(siSec-liveU)/3600; let rival;
  if(sleeping)rival=liveU>=siSec?"시은이는 잠들었어요. 오늘은 당신 승. 굳히세요.":"시은이는 잠들었어요. 지금이 따라잡을 마지막 기회예요.";
  else if(gap>5)rival="5시간 넘게 벌어졌어요. 이건 그냥 다른 경기예요.";
  else if(gap>2)rival=gap.toFixed(1)+"시간 앞서고 있어요. 책상 앞으로 오세요.";
  else if(gap>0.3)rival="조금 앞서네요. 근데 당신 페이스도 살아있는데요?";
  else if(gap>-0.3)rival="거의 나란히. 지금 일어나면 바로 역전당해요.";
  else if(gap>-2)rival="당신이 앞섰네요. 인정. 근데 하루 안 끝났어요.";
  else rival="완패네요 오늘은. 분해요. 내일은 안 봐줍니다.";
  $("quote").textContent=rival;
  $("stlmk").style.left=(minNow/1440*100)+"%";
  let week=0,siWeek=0; for(let i=0;i<7;i++){const dd=new Date(now); dd.setDate(dd.getDate()-i); const k=ld(dd); week+=i===0?liveU:(log[k]||0); siWeek+=i===0?siSec:fullDay(k)*3600;}
  $("wkMe").textContent=hm(week); $("wkSi").textContent=hm(siWeek);
  if($("cmpMeToday"))$("cmpMeToday").textContent=hm(liveU);
  if($("cmpSiToday"))$("cmpSiToday").textContent=hm(siSec);
  renderMind();
}
function toggle(){
  if(running){const el=startTs!=null?(Date.now()-startTs)/1000:0; log[dk]=(log[dk]||0)+el; startTs=null; running=false; saveCtr=0; save(); saveServer();}
  else{startTs=Date.now(); running=true; saveCtr=0;}
  tick();
}
function resetDay(){if(!confirm("오늘 기록을 0으로 초기화할까요?"))return; log[dk]=0; startTs=running?Date.now():null; saveCtr=0; save(); saveServer(); tick();}
function buildStatic(){
  const stl=$("stl"); if(!stl)return;
  SCHEDULE.forEach(function(x){const d=document.createElement("div"); d.style.width=((x.e-x.s)/1440*100)+"%";
    d.style.background=x.state==="sleep"?"#1c1722":x.state==="study"?"rgba(224,168,92,.30)":"rgba(150,140,155,.16)"; stl.appendChild(d);});
  const mk=document.createElement("div"); mk.id="stlmk"; mk.className="stlmk"; stl.appendChild(mk);
}
function showTab(name){var ss=document.querySelectorAll(".tabsec"),bs=document.querySelectorAll(".tab"),i;
  for(i=0;i<ss.length;i++)ss[i].classList.toggle("on",ss[i].getAttribute("data-tab")===name);
  for(i=0;i<bs.length;i++)bs[i].classList.toggle("on",bs[i].getAttribute("data-tab")===name);
  if(name==="cmp")buildCompare();
  if(name==="ana"){buildProgress();buildMastery();buildExams();}
  if(name==="live")playCur();}
window.addEventListener("DOMContentLoaded",function(){buildStatic(); buildProgress(); buildMastery(); buildCompare(); buildExams(); renderMind();
  $("btn").onclick=toggle; $("reset").onclick=resetDay; $("sync").onclick=setupSync;
  var tb=document.querySelectorAll(".tab"); for(var i=0;i<tb.length;i++){tb[i].addEventListener("click",function(){showTab(this.getAttribute("data-tab"));});}
  ["vidA","vidB"].forEach(function(id){$(id).addEventListener("playing",function(){$("playhint").style.display="none";});});
  $("hero").addEventListener("click",function(){playCur(); $("playhint").style.display="none";});
  document.addEventListener("click",playCur,{once:true});
  $("synced").textContent=syncKey?("● 동기화: "+syncKey):"○ 동기화 꺼짐";
  loadServer(); tick(); setInterval(tick,1000); setInterval(loadServer,60000);
  setTimeout(function(){ if(window.curVid&&window.curVid.paused)$("playhint").style.display="flex"; },1400);
});

</script></body></html>
