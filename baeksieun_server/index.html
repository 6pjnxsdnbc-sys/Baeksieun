<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>백시은 · 라이벌 자습실</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=DM+Mono:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0}
body{min-height:100vh;color:#ece6dd;font-family:'IBM Plex Sans KR',sans-serif;font-weight:300;-webkit-font-smoothing:antialiased;
  background:radial-gradient(820px 480px at 50% 0%,rgba(224,168,92,.08),transparent 60%),#0f0b10;padding:28px 18px 52px}
.wrap{max-width:460px;margin:0 auto}
.lbl{font-size:9.5px;letter-spacing:2.6px;color:#7a7280;text-transform:uppercase;font-weight:500}
.hair{height:1px;background:rgba(236,230,221,.08);margin:22px 0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.clk{font-family:'DM Mono',monospace;font-weight:300;font-size:34px;letter-spacing:.5px;line-height:1;margin-top:8px}
.dt{font-size:11.5px;color:#8b8390;margin-top:8px}
.hr2{text-align:right;display:flex;flex-direction:column;gap:8px;margin-top:2px;flex-shrink:0}
.hr2 div{font-size:11px;color:#8b8390}.hr2 b{font-weight:500;font-family:'DM Mono',monospace}
.hero{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:1/1;margin-top:20px;background:#0c0810;cursor:pointer;
  box-shadow:0 30px 70px -28px rgba(0,0,0,.85);outline:1px solid rgba(236,230,221,.07);outline-offset:-1px}
.vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .7s ease}
.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(220px 170px at 52% 64%,rgba(255,206,140,.10),transparent 72%);mix-blend-mode:screen;transition:opacity .8s;z-index:2}
.playhint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:4;font-size:13px;letter-spacing:1px;color:#fff;background:rgba(0,0,0,.28);text-shadow:0 1px 6px rgba(0,0,0,.85)}
.stt{position:absolute;top:13px;left:14px;display:flex;align-items:center;gap:7px;font-size:9.5px;letter-spacing:2px;color:#f0e8e0;text-shadow:0 1px 6px rgba(0,0,0,.85);z-index:3}
.pd{width:6px;height:6px;border-radius:50%;animation:pl 1.9s infinite;display:inline-block}@keyframes pl{50%{opacity:.3}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:46px 15px 14px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;z-index:3;
  background:linear-gradient(0deg,rgba(8,5,10,.92),rgba(8,5,10,.35) 62%,transparent)}
.who{font-family:'Gowun Batang',serif;font-size:19px}.whosub{font-size:10.5px;color:#cabfc9;font-weight:300}
.now{font-size:12px;color:#f0d4a6;margin-top:4px;min-height:17px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.cur{display:inline-block;width:5px;height:12px;background:#e0a85c;margin-left:1px;vertical-align:-1px;animation:bk 1s steps(1) infinite}@keyframes bk{50%{opacity:0}}
.clive{text-align:right;flex-shrink:0}.clivev{font-family:'DM Mono',monospace;font-size:17px;color:#f3b765;line-height:1;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.7)}.clivel{font-size:8px;color:#cabfc9;letter-spacing:1.5px;margin-top:4px}
.me{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-top:22px}
.mev{font-family:'DM Mono',monospace;font-size:38px;font-weight:300;line-height:1;color:#a9d6ca;margin-top:6px}
.strk{font-size:11px;color:#8b8390;margin-top:9px}
.btn{flex-shrink:0;padding:12px 24px;border-radius:11px;border:none;cursor:pointer;font-family:'IBM Plex Sans KR';font-weight:600;font-size:14px;letter-spacing:.5px;transition:transform .1s}
.btn:active{transform:scale(.97)}.start{background:#a9d6ca;color:#0c2722}.pause{background:#e6c282;color:#2a2009}
.rst{background:none;border:none;color:#8a8090;font-size:10.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}.acts{display:flex;flex-wrap:wrap;gap:14px;margin-top:11px;align-items:center}
.synced{font-size:9.5px;color:#6f6678;letter-spacing:.5px}
.h2hrow{display:flex;justify-content:space-between;font-size:11px;color:#8b8390;margin:11px 0 8px}.h2hrow b{font-family:'DM Mono',monospace;font-weight:400}
.track{height:5px;border-radius:99px;background:rgba(236,230,221,.07);overflow:hidden;display:flex}
.tA{background:#e0a85c;transition:width 1s ease}.tB{background:#8fc7bc;flex:1;transition:width 1s}
.quote{font-family:'Gowun Batang',serif;font-style:italic;font-size:15.5px;color:#e3cf9a;text-align:center;line-height:1.6;margin-top:20px;padding:0 6px}
.quote::before{content:"\201C";color:#6a5a3a}.quote::after{content:"\201D";color:#6a5a3a}
.stl{height:5px;border-radius:99px;overflow:hidden;display:flex;position:relative;background:rgba(236,230,221,.05);margin-top:11px}
.stlmk{position:absolute;top:-4px;width:1px;height:13px;background:#fff;box-shadow:0 0 5px rgba(255,255,255,.8)}
.stlx{display:flex;justify-content:space-between;font-size:9px;color:#6a6270;margin-top:7px;font-family:'DM Mono',monospace}
.scrow{display:flex;align-items:center;gap:12px;font-size:11px;margin-bottom:11px}
.scsub{width:62px;flex-shrink:0;color:#bdb2bc}.scbar{flex:1;min-width:0;height:4px;border-radius:99px;background:rgba(236,230,221,.06);position:relative;overflow:hidden}
.scme{position:absolute;height:100%;background:#8fc7bc;border-radius:99px}.scsi{position:absolute;height:100%;width:1px;background:#e0a85c}
.scv{width:80px;flex-shrink:0;text-align:right;color:#857b88;font-family:'DM Mono',monospace;font-size:10px;white-space:nowrap}
.wk{display:flex;align-items:center;margin-top:13px}.wkc{flex:1;text-align:center}.wkv{font-family:'DM Mono',monospace;font-size:21px;font-weight:300;margin-top:6px}
.wkd{width:1px;align-self:stretch;background:rgba(236,230,221,.08);margin:0 6px}
.ft{text-align:center;font-size:9px;color:#564f5e;margin-top:28px;line-height:1.8}
</style></head>
<body><div class="wrap">
  <div class="hd"><div><div class="lbl">지금</div><div class="clk" id="clk">00:00:00</div><div class="dt" id="dt"></div></div>
    <div class="hr2"><div>시은 컨디션 <b id="cond"></b></div><div>수능 <b id="dday"></b></div></div></div>
  <div class="hero" id="hero">
    <video class="vid" id="vidA" muted loop autoplay playsinline preload="auto"></video>
    <video class="vid" id="vidB" muted loop autoplay playsinline preload="auto"></video>
    <div class="glow" id="glow"></div>
    <div class="playhint" id="playhint">▶ 탭하여 재생</div>
    <div class="stt" id="stt"></div>
    <div class="cap"><div><div class="who">백시은<span class="whosub"> · 재수생 · 의대 지망</span></div>
      <div class="now"><span id="nowlabel"></span><span id="nowtype"></span><span class="cur" id="cur"></span></div></div>
      <div class="clive"><div class="clivev" id="siHero"></div><div class="clivel">오늘 순공</div></div></div>
  </div>
  <div class="me"><div><div class="lbl" id="melbl">나의 오늘 순공</div><div class="mev" id="mev">0h 00m</div>
    <div class="strk" id="strk"></div><div class="acts"><button class="rst" id="reset">기록 초기화</button><button class="rst" id="sync">동기화 설정</button><span class="synced" id="synced"></span></div></div>
    <button class="btn start" id="btn">공부 시작</button></div>
  <div class="hair"></div>
  <div><div class="lbl">오늘의 맞대결</div>
    <div class="h2hrow"><span>시은 <b style="color:#e0a85c" id="siH2"></b></span><span><b style="color:#8fc7bc" id="meH2"></b> 나</span></div>
    <div class="track"><div class="tA" id="tA" style="width:0%"></div><div class="tB"></div></div>
    <div class="quote" id="quote"></div></div>
  <div class="hair"></div>
  <div><div class="lbl">시은이의 하루 · 실시간 위치</div><div class="stl" id="stl"></div>
    <div class="stlx"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div></div>
  <div class="hair"></div>
  <div><div class="lbl">성적 격차 · 시은 6모(목표) → 내 현재</div><div id="scores" style="margin-top:13px"></div></div>
  <div class="hair"></div>
  <div><div class="lbl">이번 주 누적</div><div class="wk"><div class="wkc"><div class="lbl">나</div><div class="wkv" style="color:#8fc7bc" id="wkMe"></div></div>
    <div class="wkd"></div><div class="wkc"><div class="lbl">시은</div><div class="wkv" style="color:#e0a85c" id="wkSi"></div></div></div></div>
  <div class="ft">백시은은 실존 인물이 아닙니다 · 데이터는 고정 루틴과 오늘 컨디션으로 현재 시각에 맞춰 자동 계산됩니다 · 같은 동기화 키를 넣은 기기끼리 기록이 합쳐집니다</div>
</div>
<script>

const MEDIA={study:"study.mp4",stretch:"stretch.mp4",coffee:"coffee.mp4",phone:"phone.mp4",sleep:"sleep.mp4"};
const POSTERS={study:"poster_study.jpg",stretch:"poster_stretch.jpg",coffee:"poster_coffee.jpg",phone:"poster_phone.jpg",sleep:"poster_sleep.jpg"};
const SCHEDULE = [
  { s:0,    e:390,  label:"취침 중",          state:"sleep",  d:["새근새근...","내일을 위한 충전","Zzz..."] },
  { s:390,  e:420,  label:"기상 · 영단어",     state:"stretch",d:["눈 비비며 단어장 펴는 중","찬물 세수하고 정신 차리는 중"] },
  { s:420,  e:480,  label:"아침 · 약점노트",   state:"eat",    d:["어제 틀린 거 다시 보는 중","토스트 물고 약점노트 넘기는 중"] },
  { s:480,  e:600,  label:"국어 비문학",       state:"study",  d:["과학 지문 구조도 그리는 중","시간 재며 지문 푸는 중","문장 3번째 다시 읽는 중"] },
  { s:600,  e:720,  label:"수학 · 미적분",     state:"study",  d:["27번 킬러 3회독 중","극한 정의로 다시 증명 중","계산 실수 잡아내는 중"] },
  { s:720,  e:780,  label:"점심 · 산책",       state:"stretch",d:["유일하게 폰 보는 시간","머리 식히며 폰 보는 중","스트레칭하는 중"] },
  { s:780,  e:930,  label:"수학 · 기하/문풀",  state:"study",  d:["기벡 공간도형 그리는 중","모의고사 한 회분 도는 중","오답 원인 분석 중"] },
  { s:930,  e:1080, label:"사탐 · 생활과윤리", state:"study",  d:["기출 선지 꼼꼼히 분석 중","사상가 입장 표로 정리 중","제시문 두 번 읽는 중"] },
  { s:1080, e:1140, label:"저녁 식사",         state:"eat",    d:["밥 먹으며 인강 듣는 중","10분 눈 감고 쉬는 중"] },
  { s:1140, e:1260, label:"과탐 · 생명Ⅰ",      state:"study",  d:["유전 가계도 분석 중","근수축 과정 암기 중","오답 개념 다시 잡는 중"] },
  { s:1260, e:1350, label:"국어 · 오답 정리",  state:"study",  d:["오답노트 색깔별 정리 중","문학 배경지식 보는 중","EBS 연계 확인 중"] },
  { s:1350, e:1380, label:"플래너 · 마무리",   state:"stretch",d:["오늘 순공 합산 중","내일 계획 채우는 중","기지개 켜는 중"] },
  { s:1380, e:1410, label:"취침 준비",         state:"stretch",d:["불 끄기 직전","마지막 스트레칭 중"] },
  { s:1410, e:1440, label:"취침 중",           state:"sleep",  d:["방금 잠든 듯","Zzz..."] },
];
const isStudy=x=>x.state==="study";
const RAW=SCHEDULE.filter(isStudy).reduce((a,x)=>a+(x.e-x.s),0);
function hashStr(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return (h^=h>>>16)>>>0;}
function dayTypeFor(k){const r=(hashStr(k)%1000)/1000;
  if(r<0.10)return{key:"번아웃",mult:0.32,color:"#b79fc0"};
  if(r<0.35)return{key:"그럭저럭",mult:0.52,color:"#cf9f6a"};
  if(r<0.82)return{key:"평범",mult:0.64,color:"#e0a85c"};
  return{key:"불꽃",mult:0.80,color:"#ec7a4a"};}
const segAt=m=>SCHEDULE.find(x=>m>=x.s&&m<x.e)||SCHEDULE[0];
const studiedMin=m=>SCHEDULE.filter(isStudy).reduce((a,x)=>a+Math.max(0,Math.min(m,x.e)-x.s),0);
const hm=s=>Math.floor(s/3600)+"h "+String(Math.floor((s%3600)/60)).padStart(2,"0")+"m";
const fmtC=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=Math.floor(s%60);return[h,m,x].map(v=>String(v).padStart(2,"0")).join(":");};
const ld=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fullDay=k=>RAW/60*dayTypeFor(k).mult;
const SI=[{s:"국어",v:"96",p:96,me:"89",mp:89},{s:"수학",v:"98",p:98,me:"50",mp:50},{s:"영어",v:"1등급",p:96,me:"2후반",mp:78},{s:"생명Ⅰ",v:"1등급",p:96,me:"5등급",mp:40},{s:"생활과윤리",v:"1등급",p:96,me:"6등급",mp:30}];
const SUNUNG=new Date("2026-11-19T08:40:00+09:00");
const WK=["일","월","화","수","목","금","토"];
function mediaKey(seg){
  if(seg.state==="sleep")return "sleep";
  if(seg.state==="eat")return "coffee";
  if(seg.state==="stretch")return seg.label.indexOf("산책")>=0?"phone":"stretch";
  return "study";
}
let log={}; try{log=JSON.parse(localStorage.getItem("studylog")||"{}")||{};}catch(e){log={};}
let syncKey=localStorage.getItem("synckey")||"";
let running=false, startTs=null, dk=ld(new Date()), saveCtr=0, lastDetail="", typeTimer=null, curKey=null, active="A";
const base=()=>log[dk]||0;
const save=()=>{try{localStorage.setItem("studylog",JSON.stringify(log));}catch(e){}};
function $(id){return document.getElementById(id);}
// ---- server sync ----
async function loadServer(){ if(!syncKey)return;
  try{ const r=await fetch("/api/sync?key="+encodeURIComponent(syncKey)); const srv=await r.json();
    if(srv&&typeof srv==="object"){for(const k in srv){log[k]=Math.max(Number(log[k]||0),Number(srv[k]||0));} save(); tick();}
    $("synced").textContent="● 동기화: "+syncKey;
  }catch(e){ $("synced").textContent="○ 동기화 연결 실패"; }
}
async function saveServer(){ if(!syncKey)return;
  try{ await fetch("/api/sync?key="+encodeURIComponent(syncKey),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(log)}); }catch(e){}
}
function setupSync(){ const k=window.prompt("동기화 키를 입력하세요.\n모든 기기에서 같은 키를 넣으면 기록이 자동으로 동기화됩니다.\n(비우면 동기화 끔)", syncKey||"");
  if(k===null)return; syncKey=k.trim(); localStorage.setItem("synckey",syncKey);
  if(syncKey){ $("synced").textContent="● 동기화: "+syncKey; loadServer(); } else { $("synced").textContent="○ 동기화 꺼짐"; } }
function playCur(){ if(window.curVid){var p=window.curVid.play(); if(p&&p.catch)p.catch(function(){});} }
function setMedia(key){
  if(key===curKey)return; curKey=key;
  const showId=active==="A"?"vidB":"vidA", hideId=active==="A"?"vidA":"vidB";
  const show=$(showId), hide=$(hideId);
  show.poster=POSTERS[key]; show.src=MEDIA[key]; show.load(); window.curVid=show;
  const p=show.play(); if(p&&p.catch)p.catch(function(){});
  show.style.opacity="1"; hide.style.opacity="0";
  active=showId==="vidA"?"A":"B";
}
function tick(){
  const now=new Date(); const cur=ld(now);
  if(cur!==dk){dk=cur; if(running)startTs=Date.now();}
  const minNow=now.getHours()*60+now.getMinutes();
  const seg=segAt(minNow), dt=dayTypeFor(dk), st=seg.state;
  if(running&&startTs!=null){const el=(Date.now()-startTs)/1000; if(++saveCtr>=15){log[dk]=(log[dk]||0)+el; startTs=Date.now(); saveCtr=0; save(); saveServer();}}
  const siSec=Math.round(studiedMin(minNow)*60*dt.mult);
  const liveU=base()+(running&&startTs!=null?(Date.now()-startTs)/1000:0);
  $("clk").textContent=fmtC(minNow*60+now.getSeconds());
  $("dt").textContent=ld(now).replace(/-/g,". ")+" · "+WK[now.getDay()]+"요일";
  $("cond").textContent=dt.key; $("cond").style.color=dt.color;
  $("dday").textContent="D-"+Math.ceil((SUNUNG-now)/86400000);
  setMedia(mediaKey(seg));
  const sleeping=st==="sleep";
  $("glow").style.opacity=sleeping?"0":"1";
  $("stt").innerHTML='<span class="pd" style="background:'+(sleeping?"#b79fc0":st==="study"?"#8fd6a8":"#e6b56a")+'"></span>'+(sleeping?"OFFLINE":st==="study"?"STUDYING":"BREAK");
  const detail=seg.d[Math.floor((minNow/7)%seg.d.length)];
  $("nowlabel").textContent="지금 — "+seg.label+" · ";
  if(detail!==lastDetail){lastDetail=detail; let i=0; $("nowtype").textContent=""; clearInterval(typeTimer);
    typeTimer=setInterval(function(){i++; $("nowtype").textContent=detail.slice(0,i); if(i>=detail.length)clearInterval(typeTimer);},34);}
  $("cur").style.display=st==="study"?"inline-block":"none";
  $("siHero").textContent=hm(siSec);
  $("mev").textContent=hm(liveU);
  $("melbl").textContent="나의 오늘 순공"+(liveU>siSec&&!sleeping?" · 리드 중":"");
  let streak=0; for(let i=0;i<60;i++){const d=new Date(now); d.setDate(d.getDate()-i); const k=ld(d); const v=i===0?liveU:(log[k]||0); if(v>=600)streak++; else break;}
  $("strk").textContent="연속 "+streak+"일 기록 · 목표 8시간";
  $("btn").textContent=running?"멈춤":"공부 시작"; $("btn").className="btn "+(running?"pause":"start");
  const total=Math.max(liveU+siSec,1), siPct=Math.round(siSec/total*100);
  $("siH2").textContent=hm(siSec); $("meH2").textContent=hm(Math.round(liveU)); $("tA").style.width=siPct+"%";
  const gap=(siSec-liveU)/3600; let rival;
  if(sleeping)rival=liveU>=siSec?"시은이는 잠들었어요. 오늘은 당신 승. 굳히세요.":"시은이는 잠들었어요. 지금이 따라잡을 마지막 기회예요.";
  else if(gap>5)rival="5시간 넘게 벌어졌어요. 이건 그냥 다른 경기예요.";
  else if(gap>2)rival=gap.toFixed(1)+"시간 앞서고 있어요. 책상 앞으로 오세요.";
  else if(gap>0.3)rival="조금 앞서네요. 근데 당신 페이스도 살아있는데요?";
  else if(gap>-0.3)rival="거의 나란히. 지금 일어나면 바로 역전당해요.";
  else if(gap>-2)rival="당신이 앞섰네요. 인정. 근데 하루 안 끝났어요.";
  else rival="완패네요 오늘은. 분해요. 내일은 안 봐줍니다.";
  $("quote").textContent=rival;
  $("stlmk").style.left=(minNow/1440*100)+"%";
  let week=0,siWeek=0; for(let i=0;i<7;i++){const d=new Date(now); d.setDate(d.getDate()-i); const k=ld(d); week+=i===0?liveU:(log[k]||0); siWeek+=i===0?siSec:fullDay(k)*3600;}
  $("wkMe").textContent=hm(week); $("wkSi").textContent=hm(siWeek);
}
function toggle(){
  if(running){const el=startTs!=null?(Date.now()-startTs)/1000:0; log[dk]=(log[dk]||0)+el; startTs=null; running=false; saveCtr=0; save(); saveServer();}
  else{startTs=Date.now(); running=true; saveCtr=0;}
  tick();
}
function resetDay(){if(!confirm("오늘 기록을 0으로 초기화할까요?"))return; log[dk]=0; startTs=running?Date.now():null; saveCtr=0; save(); saveServer(); tick();}
function buildStatic(){
  const stl=$("stl");
  SCHEDULE.forEach(function(x){const d=document.createElement("div"); d.style.width=((x.e-x.s)/1440*100)+"%";
    d.style.background=x.state==="sleep"?"#1c1722":x.state==="study"?"rgba(224,168,92,.30)":"rgba(150,140,155,.16)"; stl.appendChild(d);});
  const mk=document.createElement("div"); mk.id="stlmk"; mk.className="stlmk"; stl.appendChild(mk);
  const sc=$("scores");
  SI.forEach(function(s){const row=document.createElement("div"); row.className="scrow";
    row.innerHTML='<span class="scsub">'+s.s+'</span><div class="scbar"><div class="scme" style="width:'+s.mp+'%"></div><div class="scsi" style="left:'+s.p+'%"></div></div><span class="scv">'+s.me+' → '+s.v+'</span>';
    sc.appendChild(row);});
}
window.addEventListener("DOMContentLoaded",function(){buildStatic(); $("btn").onclick=toggle; $("reset").onclick=resetDay; $("sync").onclick=setupSync;
  ["vidA","vidB"].forEach(function(id){$(id).addEventListener("playing",function(){$("playhint").style.display="none";});});
  $("hero").addEventListener("click",function(){playCur(); $("playhint").style.display="none";});
  document.addEventListener("click",playCur,{once:true});
  $("synced").textContent=syncKey?("● 동기화: "+syncKey):"○ 동기화 꺼짐";
  loadServer(); tick(); setInterval(tick,1000); setInterval(loadServer,60000);
  setTimeout(function(){ if(window.curVid&&window.curVid.paused)$("playhint").style.display="flex"; },1400);
});

</script></body></html>
